# Docker Compose — Local development infrastructure
# For contributors who prefer running services locally instead of cloud.
#
# Usage:
#   docker compose up -d
#
# This starts PostgreSQL (with pgvector), Redis, and Meilisearch locally.
# Then copy .env.example to .env and use the local connection strings shown below.
#
# Local connection strings (uncomment in .env to use):
#   DATABASE_URL=postgresql://codexa:codexa@localhost:5432/codexa
#   REDIS_URL=redis://localhost:6379
#   MEILI_URL=http://localhost:7700
#   MEILI_MASTER_KEY=codexa_dev_master_key

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codexa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: codexa
      POSTGRES_PASSWORD: codexa
      POSTGRES_DB: codexa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codexa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codexa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: codexa-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: codexa_dev_master_key
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  meili_data:
